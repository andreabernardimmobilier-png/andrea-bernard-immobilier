backend:
  name: github
  repo: andreabernardimmobilier-png/andrea-bernard-immobilier
  branch: main
  base_url: https://api.decapbridge.com
  auth_endpoint: auth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "biens"
    label: "Biens immobiliers"
    folder: "data/biens"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "titre", widget: "string" }
      - { label: "Type de transaction", name: "transaction", widget: "select", options: ["À vendre", "À louer"] }
      - { label: "Statut", name: "statut", widget: "select", options: ["Exclusivité", "Nouvelle offre", "Sous compromis", "Sous offre", "Vendu", "Loué"], required: false }
      - { label: "Ville", name: "ville", widget: "string" }
      - { label: "Prix", name: "prix", widget: "number" }
      - { label: "Surface (m²)", name: "surface", widget: "number", required: false }
      - { label: "Terrain (m²)", name: "terrain", widget: "number", required: false }
      - { label: "Chambres", name: "chambres", widget: "number", required: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Photos", name: "photos", widget: "list", field: { label: "Photo", name: "photo", widget: "image" } }
