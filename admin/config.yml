backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "fr"

collections:
  - name: "biens"
    label: "Biens immobiliers"
    label_singular: "Bien"
    files:
      - name: "listings"
        label: "Liste des biens"
        file: "data/listings.json"
        fields:
          - label: "Biens"
            name: "biens"
            widget: "list"
            summary: "{{titre}} — {{prix}}"
            fields:
              - {label: "Titre", name: "titre", widget: "string"}
              - label: "Type"
                name: "type"
                widget: "select"
                options: [{label: "À vendre", value: "vente"}, {label: "À louer", value: "location"}]
              - {label: "Hors marché", name: "hors_marche", widget: "boolean", default: false}
              - {label: "Prix", name: "prix", widget: "string", hint: "Ex. 495 000 € ou 1 250 € / mois"}
              - {label: "Localisation", name: "localisation", widget: "string"}
              - {label: "Surface", name: "surface", widget: "string"}
              - {label: "Pièces / terrain", name: "pieces", widget: "string"}
              - {label: "DPE", name: "dpe", widget: "string"}
              - {label: "Description", name: "description", widget: "text", hint: "Texte complet de l'annonce. Les 4 premières lignes apparaissent sur l'accueil."}
              - {label: "Photo", name: "photo", widget: "image"}
