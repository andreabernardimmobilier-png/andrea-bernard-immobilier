# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: andreabernardimmobilier-png/andrea-bernard-immobilier
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/c33df05a-b679-4d59-b4e1-0bbd2850f755/pkce
  auth_token_endpoint: /sites/c33df05a-b679-4d59-b4e1-0bbd2850f755/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://andreabernardimmobilier.fr

media_folder: "images"
public_folder: "/images"

collections:
  - name: "biens"
    label: "Biens immobiliers"
    folder: "data/biens"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "titre", widget: "string" }
      - { label: "Type de transaction", name: "transaction", widget: "select", options: ["À vendre", "À louer"] }
      - { label: "Statut", name: "statut", widget: "select", options: ["Exclusivité", "Nouvelle offre", "Sous compromis", "Sous offre", "Vendu", "Loué"], required: false }
      - { label: "Ville", name: "ville", widget: "string" }
      - { label: "Code postal", name: "code_postal", widget: "string", required: false }
      - { label: "DPE", name: "dpe", widget: "select", options: ["A", "B", "C", "D", "E", "F", "G"], required: false }
      - { label: "Prix", name: "prix", widget: "number" }
      - { label: "Surface (m²)", name: "surface", widget: "number", required: false }
      - { label: "Terrain (m²)", name: "terrain", widget: "number", required: false }
      - { label: "Chambres", name: "chambres", widget: "number", required: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Photos", name: "photos", widget: "list", field: { label: "Photo", name: "photo", widget: "image" } }
