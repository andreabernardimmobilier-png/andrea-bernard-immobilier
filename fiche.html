<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bien — Andrea Bernard Immobilier</title>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<style>
  :root{--navy:#0f1f38;--navy-light:#1c3358;--gold:#b98d3e;--gold-light:#d4af6a;--cream:#f7f5f1;--ink:#1a1a1a;--muted:#6b6b6b;--line:#e3ddd1;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Georgia','Times New Roman',serif;color:var(--ink);background:var(--cream);line-height:1.6;}
  .sans{font-family:-apple-system,Arial,sans-serif;}
  a{color:inherit;text-decoration:none;}
  header{background:var(--navy);color:#fff;padding:18px 24px;}
  .brand{font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase;max-width:1120px;margin:0 auto;}
  .brand strong{color:var(--gold-light);font-weight:400;}
  .wrap{max-width:900px;margin:0 auto;padding:40px 24px;}
  .back{display:inline-block;margin-bottom:24px;font-family:-apple-system,Arial,sans-serif;font-size:.85rem;color:var(--gold);}
  .gallery{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:32px;}
  .gallery img{width:100%;border-radius:2px;object-fit:cover;max-height:520px;}
  .gallery-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:8px;}
  .gallery-thumbs img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;border-radius:2px;opacity:.7;}
  .gallery-thumbs img:hover{opacity:1;}
  .tag{font-family:-apple-system,Arial,sans-serif;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  h1{font-size:1.8rem;font-weight:400;color:var(--navy);margin-bottom:8px;}
  .loc{font-family:-apple-system,Arial,sans-serif;color:var(--muted);margin-bottom:20px;}
  .price{font-family:-apple-system,Arial,sans-serif;font-size:1.6rem;color:var(--navy);font-weight:600;margin-bottom:24px;}
  .meta{display:flex;gap:24px;font-family:-apple-system,Arial,sans-serif;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;margin-bottom:28px;}
  .desc{font-size:1.02rem;color:#333;white-space:pre-line;margin-bottom:32px;}
  .contact-cta{background:var(--navy);color:#fff;padding:28px;text-align:center;}
  .contact-cta a{color:var(--gold-light);font-family:-apple-system,Arial,sans-serif;}
</style>
</head>
<body>
<header><div class="brand">Andrea Bernard <strong>Immobilier</strong></div></header>
<div class="wrap">
  <a class="back" href="/">← Retour aux biens</a>
  <div id="content">Chargement…</div>
</div>
<script>
(async function () {
  const owner = "andreabernardimmobilier-png";
  const repo = "andrea-bernard-immobilier";
  const branch = "main";
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");
  const content = document.getElementById("content");
  if (!slug) { content.innerHTML = "Bien introuvable."; return; }
  try {
    const res = await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/${branch}/data/biens/${slug}.md`);
    if (!res.ok) { content.innerHTML = "Bien introuvable."; return; }
    const raw = await res.text();
    const parts = raw.split("---");
    const data = jsyaml.load(parts[1]);
    document.title = (data.titre || "Bien") + " — Andrea Bernard Immobilier";
    const photos = data.photos || [];
    const meta = [];
    if (data.chambres) meta.push(`<span>${data.chambres} chambres</span>`);
    if (data.surface) meta.push(`<span>${data.surface} m²</span>`);
    if (data.terrain) meta.push(`<span>${data.terrain} m² terrain</span>`);
    content.innerHTML = `
      <div class="gallery">
        <img id="main-photo" src="${photos[0] || ''}" alt="${data.titre || ''}">
        ${photos.length > 1 ? `<div class="gallery-thumbs">${photos.map(p => `<img src="${p}" onclick="document.getElementById('main-photo').src='${p}'">`).join("")}</div>` : ""}
      </div>
      <div class="tag">${[data.statut, data.transaction].filter(Boolean).join(" — ")}</div>
      <h1>${data.titre || ""}</h1>
      <div class="loc">${data.ville || ""}</div>
      <div class="price">${data.prix ? Number(data.prix).toLocaleString("fr-FR") + " €" : ""}</div>
      <div class="meta">${meta.join("")}</div>
      <p class="desc">${data.description || ""}</p>
    `;
  } catch (e) {
    content.innerHTML = "Erreur de chargement.";
  }
})();
</script>
<div class="contact-cta">
  <p class="sans">Intéressé par ce bien ?</p>
  <a href="tel:0646150766">06 46 15 07 66</a> &nbsp;·&nbsp;
  <a href="mailto:andrea.bernard.immobilier@gmail.com">andrea.bernard.immobilier@gmail.com</a>
</div>
</body>
</html>
